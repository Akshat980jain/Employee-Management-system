# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Disable KSP incremental processing to prevent Windows file-locking / NoSuchFileException
ksp.incremental=false

# Kotlin daemon settings - use single shared daemon to avoid multi-daemon file locking conflicts
kotlin.daemon.jvm.options=-Xmx4096m

# Kill idle daemons after 5 minutes to prevent stale lock holders
org.gradle.daemon.idletimeout=300000

# Disable parallel execution to prevent multiple tasks competing for the same output files on Windows
org.gradle.parallel=false
