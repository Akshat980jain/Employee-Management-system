<script>
        function handleInteraction(element) {
            // Tactical haptic-like scale effect
            element.classList.add('scale-90');
            setTimeout(() => {
                element.classList.remove('scale-90');
            }, 100);
            
            console.log('Action triggered:', element.querySelector('span:last-child').innerText);
        }

        // Entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.grid > button');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.4s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
